# Copy .env.example to .env and fill in JWT_SECRET_KEY and KYC_ENCRYPTION_KEY first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpilot-local-only}
      POSTGRES_DB: finpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: postgresql+psycopg://finpilot:${POSTGRES_PASSWORD:-finpilot-local-only}@db:5432/finpilot
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?copy .env.example to .env and set JWT_SECRET_KEY}
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY:?generate one - see .env.example}
      FRONTEND_ORIGIN: http://localhost:8080
      TRUST_PROXY: "true"   # api sits behind the nginx container in this stack
      UPLOAD_DIRECTORY: /app/data/uploads
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes: [uploads:/app/data/uploads]

  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: ${DEMO_MODE:-true}
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
  uploads:
